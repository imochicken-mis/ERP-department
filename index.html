<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<title>ERP Implementation Dashboard</title>
<link rel="stylesheet" href="style.css">

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img id="logo" class="brand-logo" alt="" hidden>
      <div>
        <div class="eyebrow" id="company">Imo Chicken &amp; Agro (Pvt) Ltd.</div>
        <h1>ERP Implementation Progress</h1>
        <div class="sub" id="subtitle">Loading the latest figures from the sheet…</div>
        <div class="note" id="logo-note" hidden style="margin-top:4px"></div>
      </div>
    </div>
    <div class="meta">
      <nav class="tabs" id="tabs" aria-label="Dashboard sections">
        <button type="button" data-tab="summary" aria-pressed="true">Executive Summary</button>
        <button type="button" data-tab="tracker" aria-pressed="false">Module Progress &amp; Weekly Tracker</button>
        <button type="button" data-tab="scope" aria-pressed="false">Scope &amp; Documentation</button>
        <button type="button" data-tab="issues" aria-pressed="false">Master Issue Log <em>Soon</em></button>
      </nav>
      <span id="updated"></span>
      <button class="btn" id="refresh" type="button">Refresh</button>
      <button class="btn" id="theme" type="button" aria-label="Switch between light and dark theme">◐ Dark</button>
    </div>
  </header>

  <main id="app">
    <div class="loading" role="status" aria-live="polite">
      <div class="load-bar"><i></i></div>
      <div class="load-line">
        <span class="spinner"></span>
        <span><b id="load-text">Reading the BA tab…</b> pulling this week's figures from the sheet</span>      </div>
      <div class="kpis">
        <div class="card tile sk-tile"><div class="sk sk-l"></div><div class="sk sk-n"></div><div class="sk sk-b"></div><div class="sk sk-s"></div></div>
        <div class="card tile sk-tile"><div class="sk sk-l"></div><div class="sk sk-n"></div><div class="sk sk-b"></div><div class="sk sk-s"></div></div>
        <div class="card tile sk-tile"><div class="sk sk-l"></div><div class="sk sk-n"></div><div class="sk sk-b"></div><div class="sk sk-s"></div></div>
        <div class="card tile sk-tile"><div class="sk sk-l"></div><div class="sk sk-n"></div><div class="sk sk-b"></div><div class="sk sk-s"></div></div>
        <div class="card tile sk-tile"><div class="sk sk-l"></div><div class="sk sk-n"></div><div class="sk sk-b"></div><div class="sk sk-s"></div></div>
        <div class="card tile sk-tile"><div class="sk sk-l"></div><div class="sk sk-n"></div><div class="sk sk-b"></div><div class="sk sk-s"></div></div>
      </div>
      <div class="card sk-wide"><div class="sk"></div><div class="sk"></div></div>
    </div>
  </main>
  <footer class="footer">&copy; 2026 Imo Chicken &amp; Agro (Pvt) Ltd. &bull; MIS Department &bull; All Rights Reserved.</footer>
</div>
<div class="modal" id="modal" hidden></div>

<script src="app.js"></script>
</body>
</html>
